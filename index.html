<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TC Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="jspdf.umd.min.js"></script>
<style>
:root{--desk:#c5d1b6;--paper:#e8f0dc;--line:#bccbaa;--ink:#16263a;--soft:#4f6455;--red:#c23b2e;--btn:#16263a;--btnt:#e8f0dc;--fill:#7fa36b;--sheet:#f1f6e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#090d0b;--paper:#121a17;--line:#25332c;--ink:#e3ebdd;--soft:#8fa596;--red:#f0705f;--btn:#e3ebdd;--btnt:#121a17;--fill:#5e8c6c;--sheet:#17211d}}
:root[data-theme="dark"]{--desk:#090d0b;--paper:#121a17;--line:#25332c;--ink:#e3ebdd;--soft:#8fa596;--red:#f0705f;--btn:#e3ebdd;--btnt:#121a17;--fill:#5e8c6c;--sheet:#17211d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:Figtree,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45;min-height:100vh}
.pad{position:relative;max-width:640px;margin:20px auto 40px;background:var(--paper);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.18);padding:46px 18px 28px 84px;overflow:hidden}
.pad::before{content:"";position:absolute;left:0;right:0;top:0;height:24px;background:radial-gradient(circle at 12px 12px,var(--desk) 5px,transparent 6px) 0 0/28px 24px repeat-x;opacity:.9}
.pad::after{content:"";position:absolute;top:0;bottom:0;left:68px;width:2px;background:var(--red);opacity:.55}
@media(max-width:520px){.pad{margin:0;border-radius:0;padding-left:68px;padding-right:14px;min-height:100vh}.pad::after{left:54px}}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2.4rem;letter-spacing:-.02em;line-height:1;margin:0}
.lede{color:var(--soft);margin:6px 0 22px;font-size:.95rem}
h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.05rem;margin:30px 0 4px}
.hint{color:var(--soft);font-size:.85rem;margin:0 0 12px}
.dateRow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
.dateRow label{display:block;font-size:.8rem;color:var(--soft);margin-bottom:2px}
input[type=date]{font:600 1.35rem 'Bricolage Grotesque',sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);padding:4px 0;outline:none;color-scheme:light dark;min-width:170px}
input[type=date]:focus-visible{border-bottom-color:var(--red)}
.pickBtn{margin-left:auto;font:800 1.15rem 'Bricolage Grotesque',sans-serif;background:var(--btn);color:var(--btnt);border:0;border-radius:999px;padding:14px 40px;cursor:pointer;transition:transform .12s}
.pickBtn:active{transform:scale(.96)}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.left{margin-top:10px;font-size:.9rem;color:var(--soft)}
.left b{color:var(--ink);font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem}
.vols{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.vol{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--soft)}
.vol i{display:block;width:100%;height:44px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.vol i s{position:absolute;left:0;right:0;bottom:0;background:var(--fill);transition:height .4s}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
.row .dt{font:700 1rem 'Bricolage Grotesque',sans-serif;min-width:130px}
.row .tcs{flex:1;display:flex;flex-wrap:wrap;gap:4px 8px;color:var(--soft);font-size:.85rem}
.row .tcs span{color:var(--red);font-weight:600}
.row .n{font-size:.8rem;color:var(--soft)}
.empty{color:var(--soft);padding:14px 0;font-size:.92rem}
.clear{margin-top:22px;background:none;border:0;color:var(--soft);font-size:.82rem;text-decoration:underline;cursor:pointer;padding:0}
.ov{position:fixed;inset:0;background:rgba(5,10,8,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.sheet{background:var(--sheet);color:var(--ink);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px;max-width:560px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grip{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font:800 1.3rem 'Bricolage Grotesque',sans-serif;margin:0}
.sheet .sub{color:var(--soft);font-size:.9rem;margin:2px 0 14px}
.big{width:100%;text-align:center;font:800 3.4rem 'Bricolage Grotesque',sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);outline:none;padding:4px 0;-moz-appearance:textfield}
.big::-webkit-outer-spin-button,.big::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips{display:flex;gap:8px;justify-content:center;margin:14px 0}
.chips button{min-width:46px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:600;cursor:pointer}
.chips button:hover{border-color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:.95rem;cursor:pointer}
.acts button.main{background:var(--btn);color:var(--btnt);border-color:var(--btn);flex:1.6}
.acts button.danger{color:var(--red)}
.ent{display:grid;grid-template-columns:62px 1fr auto;gap:4px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ent.go{animation:rise .38s both}
@keyframes rise{from{opacity:0;transform:translateY(14px) rotate(-1deg)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.ent.go,.sheet{animation:none}.vol i s{transition:none}}
.ent .no{font:800 1.9rem 'Bricolage Grotesque',sans-serif;color:var(--red);line-height:1;text-align:center}
.ent .no small{display:block;font:500 .68rem Figtree,sans-serif;color:var(--soft);margin-top:2px}
.ent .nm{font-weight:600;font-size:1.02rem}
.ent .mt{color:var(--soft);font-size:.85rem}
.yt{display:inline-flex;align-items:center;gap:6px;background:#d93025;color:#fff;border-radius:10px;padding:9px 12px;font-size:.82rem;font-weight:600;text-decoration:none;white-space:nowrap}
.yt svg{width:14px;height:14px;fill:#fff}
.ent .rm{grid-column:2/4;justify-self:start;background:none;border:0;color:var(--red);font-size:.8rem;padding:0;cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:.9rem;display:none;z-index:99}
.getm{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--red);color:#fff;font:800 1rem 'Bricolage Grotesque',sans-serif;cursor:pointer}
.getm:disabled{opacity:.6}
.getm+.acts{margin-top:10px}
a.getm{display:block;text-align:center;text-decoration:none}
a.getm.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px;font-weight:700}
#dlShare{display:none;width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<main class="pad">
  <h1>TC Picker</h1>
  <p class="lede">Aaj ka transcription target, random aur bina repeat ke.</p>

  <div class="dateRow">
    <div><label for="date">Target date</label><input id="date" type="date"></div>
    <button class="pickBtn" id="pickBtn">PICK</button>
  </div>
  <div class="left" id="left"></div>

  <h2>Volume coverage</h2>
  <p class="hint">Har bar ek KC volume hai. Jitna bhara, utni TC pick ho chuki.</p>
  <div class="vols" id="vols"></div>

  <h2>Saved targets</h2>
  <p class="hint">Date pe tap karo, us din ki exercises dikh jayengi.</p>
  <div id="lib"></div>
  <button class="clear" id="resetBtn">Clear all data</button>
</main>

<div class="ov" id="ovCount"><div class="sheet">
  <div class="grip"></div>
  <h3>Kitni PICK karni hain?</h3>
  <div class="sub" id="cntInfo"></div>
  <input class="big" id="cnt" type="number" min="1" inputmode="numeric" placeholder="2">
  <div class="chips" id="chips"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="5">5</button><button data-n="10">10</button></div>
  <div class="acts"><button id="cntCancel">Cancel</button><button class="main" id="cntGo">Pick</button></div>
</div></div>

<div class="ov" id="ovPick"><div class="sheet">
  <div class="grip"></div>
  <h3>Target for <span id="pDate"></span></h3>
  <div class="sub" id="pSub"></div>
  <div id="pList"></div>
  <button class="getm" id="pGet">GET MATTERS (PDF)</button>
  <div class="acts"><button id="pClose">Close</button><button id="pRe">Pick again</button><button class="main" id="pSave">Save target</button></div>
</div></div>

<div class="ov" id="ovView"><div class="sheet">
  <div class="grip"></div>
  <h3 id="vTitle"></h3>
  <div class="sub" id="vSub"></div>
  <div id="vList"></div>
  <button class="getm" id="vGet">GET MATTERS (PDF)</button>
  <div class="acts"><button class="danger" id="vDel">Delete this day</button><button class="main" id="vClose">Close</button></div>
</div></div>
<div class="ov" id="ovPdf"><div class="sheet">
  <div class="grip"></div>
  <h3>PDF ready</h3>
  <div class="sub" id="dlSub"></div>
  <a class="getm" id="dlLink" download="matters.pdf">Download PDF</a>
  <a class="getm alt" id="dlOpen" target="_blank" rel="noopener">Open / Preview</a>
  <button id="dlShare">Share (Telegram etc.)</button>
  <div class="acts"><button class="main" id="dlClose">Close</button></div>
</div></div>
<div class="toast" id="toast"></div>

const JSON_URL='kc840_transcriptions_cleaned.json';
let MATTERS=null;
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open('tcpicker_db',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function idbSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
function pickJsonFile(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>res(i.files[0]||null);i.oncancel=()=>res(null);i.click()})}
function indexMatters(arr){
  if(!Array.isArray(arr)||!arr.length||!arr[0].transcription)return null;
  return new Map(arr.map(x=>[+x.transcription_no,x]));
}
async function loadMatters(){
  if(MATTERS)return MATTERS;
  let arr=null;
  try{const r=await fetch(JSON_URL,{cache:'no-cache'});if(r.ok){arr=await r.json();idbSet('kc840',arr)}}catch(e){}
  if(!indexMatters(arr))arr=await idbGet('kc840');
  if(!indexMatters(arr)){
    toast('JSON nahi mili, kc840_transcriptions_cleaned.json select karo');
    const f=await pickJsonFile();
    if(!f)return null;
    try{arr=JSON.parse(await f.text())}catch(e){toast('JSON file sahi nahi hai');return null}
    if(!indexMatters(arr)){toast('JSON me transcription field nahi mila');return null}
    idbSet('kc840',arr);
  }
  MATTERS=indexMatters(arr);
  return MATTERS;
}
const CYR={'с':'c','о':'o','а':'a','е':'e','р':'p','г':'r'};
const KEEP='—–‘’“”…•€™';
function cleanText(t){
  t=String(t).replace(/\r/g,'').replace(/\t/g,' ').replace(/[\u00a0\u2009\u200b]/g,' ');
  let o='';
  for(const ch of t){const c=ch.charCodeAt(0);
    if(ch==='\n'||(c>=32&&c<=126)||(c>=161&&c<=255)||KEEP.includes(ch))o+=ch;
    else if(CYR[ch])o+=CYR[ch];
    else if(c===160)o+=' ';}
  return o.split('\n').map(s=>s.replace(/ {2,}/g,' ').trim()).filter(Boolean);
}
/* Page: A4, cream paper, ink text. Font auto-fits (max 12pt -> min 9.5pt) so 1 matter = 1 page */
const PDFC={bg:[250,246,234],ink:[29,39,51],soft:[96,110,100],line:[207,200,178],badge:[22,38,58],badget:[250,246,234],red:[194,59,46]};
const MAXFS=12,MINFS=9.25;
function buildMattersPdf(JsPDF,rows,dateLabel){
  const doc=new JsPDF({unit:'pt',format:'a4',compress:true});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  const MX=42,TOP=34,BOT=46,BW=W-2*MX;
  const bgPage=()=>{doc.setFillColor(...PDFC.bg);doc.rect(0,0,W,H,'F')};
  rows.forEach((r,idx)=>{
    if(idx>0)doc.addPage();
    bgPage();
    /* header */
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...PDFC.soft);
    doc.text('THE SSC SCHOLARS  |  KC 840 DICTATION',MX,TOP);
    if(dateLabel)doc.text(dateLabel.toUpperCase(),W-MX,TOP,{align:'right'});
    const bx=MX,bw=62,tx=MX+bw+16,tw=BW-bw-16;
    doc.setFont('times','bold');doc.setFontSize(18);
    const tl=doc.splitTextToSize(r.topic,tw).slice(0,2);
    const bh=Math.max(48,tl.length*21+22),by=TOP+12;
    doc.setFillColor(...PDFC.badge);doc.roundedRect(bx,by,bw,bh,6,6,'F');
    doc.setTextColor(...PDFC.badget);doc.setFont('helvetica','bold');doc.setFontSize(8);
    doc.text('TC',bx+bw/2,by+bh/2-8,{align:'center'});
    doc.setFont('times','bold');doc.setFontSize(22);
    doc.text(String(r.transcription_no),bx+bw/2,by+bh/2+14,{align:'center'});
    doc.setTextColor(...PDFC.ink);doc.setFont('times','bold');doc.setFontSize(18);
    let ty=by+19;tl.forEach(l=>{doc.text(l,tx,ty);ty+=21});
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...PDFC.soft);
    doc.text('KC Volume '+r.volume+'   |   '+r.total_words+' words',tx,by+bh-4);
    const ry=by+bh+12;
    doc.setDrawColor(...PDFC.red);doc.setLineWidth(1.6);doc.line(MX,ry,MX+46,ry);
    doc.setDrawColor(...PDFC.line);doc.setLineWidth(.6);doc.line(MX+46,ry,W-MX,ry);
    /* body: auto-fit */
    const paras=cleanText(r.transcription);
    const top1=ry+22,avail=H-BOT-top1;
    doc.setFont('times','normal');
    const lay=fs=>{doc.setFontSize(fs);const L=paras.map(p=>doc.splitTextToSize(p,BW));const lh=fs*1.42,pg=fs*.6;
      const h=L.reduce((a,l)=>a+l.length*lh,0)+(L.length-1)*pg;return{L,lh,pg,h}};
    let fs=MAXFS,res=lay(fs);
    while(res.h>avail&&fs>MINFS){fs=Math.round((fs-.25)*100)/100;res=lay(fs)}
    doc.setFontSize(fs);doc.setTextColor(...PDFC.ink);
    let y=top1+fs*.8;
    res.L.forEach((lines,pi)=>{
      lines.forEach(l=>{
        if(y>H-BOT){doc.addPage();bgPage();
          doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...PDFC.soft);
          doc.text('TC '+r.transcription_no+'  |  '+r.topic+'  (contd.)',MX,TOP);
          doc.setDrawColor(...PDFC.line);doc.setLineWidth(.6);doc.line(MX,TOP+8,W-MX,TOP+8);
          doc.setFont('times','normal');doc.setFontSize(fs);doc.setTextColor(...PDFC.ink);y=TOP+34}
        doc.text(l,MX,y);y+=res.lh});
      y+=res.pg});
  });
  /* footer on every page */
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);
    doc.setDrawColor(...PDFC.line);doc.setLineWidth(.6);doc.line(MX,H-32,W-MX,H-32);
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...PDFC.soft);
    doc.text('The SSC Scholars Official  |  t.me/thesscscholarsofficial',MX,H-20);
    doc.text('Page '+i+' / '+n,W-MX,H-20,{align:'right'});}
  doc.setProperties({title:'KC 840 Matters',author:'The SSC Scholars'});
  return doc;
}
let pdfUrl=null,pdfFile=null;
function showPdf(blob,name,nm,np,partial){
  if(pdfUrl)URL.revokeObjectURL(pdfUrl);
  pdfUrl=URL.createObjectURL(blob);
  pdfFile=new File([blob],name,{type:'application/pdf'});
  $('dlLink').href=pdfUrl;$('dlLink').download=name;$('dlOpen').href=pdfUrl;
  $('dlSub').textContent=nm+' matter, '+np+' page'+(partial?' (kuch matter JSON me nahi mile)':'');
  let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[pdfFile]}))}catch(e){}
  $('dlShare').style.display=can?'block':'none';
  open('ovPdf');
}
$('dlShare').onclick=async()=>{try{await navigator.share({files:[pdfFile],title:pdfFile.name})}catch(e){}};
$('dlClose').onclick=()=>close('ovPdf');
async function getMatters(list,dateKey,btn){
  if(!list||!list.length)return;
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){toast('PDF library load nahi hui, internet check karo');return}
  const old=btn.textContent;btn.disabled=true;btn.textContent='PDF ban rahi hai...';
  try{
    const M=await loadMatters();if(!M)return;
    await new Promise(r=>setTimeout(r,30));
    const rows=list.map(r=>M.get(r[0])).filter(Boolean);
    if(!rows.length){toast('Matter JSON me nahi mila');return}
    const doc=buildMattersPdf(J,rows,dateKey?fmt(dateKey):'');
    const name='KC840_Matters_'+(dateKey||today())+'.pdf';
    showPdf(doc.output('blob'),name,rows.length,doc.getNumberOfPages(),rows.length<list.length);
  }catch(e){console.error(e);toast('PDF me error aaya')}
  finally{btn.disabled=false;btn.textContent=old}
}
$('pGet').onclick=e=>getMatters(current,curDate,e.currentTarget);
$('vGet').onclick=e=>getMatters((store.days[viewDate]||[]).map(n=>MAP.get(n)),viewDate,e.currentTarget);


renderLib();
</script>
